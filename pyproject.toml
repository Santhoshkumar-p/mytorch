[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
openai   = ["openai>=1.30"]
vertex   = ["google-genai>=1.0"]
all      = ["openai>=1.30", "google-genai>=1.0"]
dev      = ["pytest", "pytest-asyncio", "openai>=1.30", "google-genai>=1.0"]
